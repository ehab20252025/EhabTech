<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيهاب تِك | مساعد الأعطال الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; color: #333; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--accent); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .btn { border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-upload { background: #27ae60; color: white; }
        .btn-ai { background: #e67e22; color: white; display: none; }
        #preview { width: 100%; border-radius: 10px; display: none; margin-top: 15px; border: 2px solid #ddd; }
        #response { display: none; background: #fff; padding: 15px; border-radius: 10px; margin-top: 20px; border-right: 5px solid var(--accent); line-height: 1.8; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .loader { display: none; margin: 20px 0; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-tools"></i> إيهاب تِك</h1>
    <p>مساعد الأعطال الذكي - نسخة الدعم الفني</p>
</div>

<div class="container">
    <div class="card">
        <p>ارفع صورة العطل أو موديل الجهاز</p>
        <label class="btn btn-upload">
            <i class="fas fa-camera"></i> تصوير العطل / اختيار صورة
            <input type="file" id="imgInput" accept="image/*" hidden onchange="previewImg(this)">
        </label>
        <img id="preview">
        
        <button id="runBtn" class="btn btn-ai" onclick="analyzeFault()">
            <i class="fas fa-magic"></i> استخراج حل "الزتونة"
        </button>
        
        <div id="loader" class="loader">
            <i class="fas fa-spinner fa-spin"></i> جاري استشارة الخبير الذكي...
        </div>
    </div>
    <div id="response"></div>
</div>

<script>
    let imgBase64 = "";
    // ضع مفتاح الـ API الجديد هنا
    const FINAL_API_KEY = "AIzaSyDQQdwHq7SntCbwiCJ6eueTP1dmATIYQyM"; 

    function previewImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                imgBase64 = e.target.result.split(',')[1];
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('runBtn').style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function analyzeFault() {
        const loader = document.getElementById('loader');
        const resp = document.getElementById('response');
        loader.style.display = 'block';
        resp.style.display = 'none';

        try {
            // "الزتونة": استخدام v1beta مع gemini-1.5-flash-latest لضمان التشغيل
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${FINAL_API_KEY}`;
            
            const requestBody = {
                contents: [{
                    parts: [
                        { text: "أنت مهندس دعم فني خبير بمكاتب البريد المصرية. حلل الصورة، حدد الجهاز، واشرح الحل بالعامية المصرية بأسلوب الزتونة." },
                        { inline_data: { mime_type: "image/jpeg", data: imgBase64 } }
                    ]
                }]
            };

            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error.message);
            }

            const resultText = data.candidates[0].content.parts[0].text;
            resp.innerHTML = `<strong>تشخيص إيهاب تِك:</strong><br>${resultText.replace(/\n/g, '<br>')}`;
            resp.style.display = 'block';

        } catch (err) {
            console.error(err);
            alert("تنبيه: " + err.message);
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>
